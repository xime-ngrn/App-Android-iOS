name: camara_microfono
description: "Práctica ESCOM-IPN: cámara, micrófono y galería multiplataforma con Clean Architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Gestión de estado
  provider: ^6.1.2
  # Acceso a recursos del dispositivo
  camera: ^0.11.1
  record: ^6.0.0
  just_audio: ^0.10.4
  permission_handler: ^12.0.0
  geolocator: ^14.0.0
  # Almacenamiento y persistencia
  path_provider: ^2.1.5
  path: ^1.9.0
  sqflite: ^2.4.2
  shared_preferences: ^2.3.3
  # Procesamiento, exportación e importación
  image: ^4.5.4
  archive: ^4.0.7
  share_plus: ^11.0.0
  file_picker: ^10.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
